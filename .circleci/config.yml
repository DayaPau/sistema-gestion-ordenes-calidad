
version: 2.1

executors:
  java17:
    docker:
      - image: cimg/openjdk:17.0
    working_directory: ~/project

commands:
  restaurar_dependencias:
    steps:
      - restore_cache:
          keys:
            - maven-v1-{{ checksum "pom.xml" }}
            - maven-v1-

  guardar_dependencias:
    steps:
      - save_cache:
          key: maven-v1-{{ checksum "pom.xml" }}
          paths:
            - ~/.m2/repository

  notificar_fallo:
    steps:
      - run:
          name: Notificar fallo a Discord
          when: on_fail
          command: |
            if [ -n "${DISCORD_WEBHOOK:-}" ]; then
              bash scripts/notificar-discord.sh FAILURE || true
            fi

jobs:
  build:
    executor: java17
    steps:
      - checkout
      - restaurar_dependencias
      - run:
          name: Verificar entorno
          command: mvn -version
      - run:
          name: Limpiar y compilar
          command: mvn -B -ntp clean compile -DskipTests
      - guardar_dependencias
      - notificar_fallo

  tests:
    executor: java17
    steps:
      - checkout
      - restaurar_dependencias
      - run:
          name: Preparar validaciones
          command: bash scripts/preparar-validaciones.sh
      - run:
          name: Pruebas JUnit y cobertura JaCoCo
          command: |
            cd .pipeline-work/tests
            mvn -B -ntp verify
      - store_test_results:
          path: .pipeline-work/tests/target/surefire-reports
      - store_artifacts:
          path: .pipeline-work/tests/target/site/jacoco
          destination: cobertura-jacoco
      - notificar_fallo

  quality:
    executor: java17
    steps:
      - checkout
      - restaurar_dependencias
      - run:
          name: Preparar validaciones
          command: bash scripts/preparar-validaciones.sh
      - run:
          name: Analizar calidad de codigo
          command: |
            cd .pipeline-work/quality
            bash scripts/validar-calidad.sh
      - notificar_fallo

  package:
    executor: java17
    steps:
      - checkout
      - restaurar_dependencias
      - run:
          name: Empaquetar proyecto
          command: mvn -B -ntp -DskipTests package
      - store_artifacts:
          path: target
          destination: paquete
      - run:
          name: Notificar exito a Discord
          when: on_success
          command: |
            if [ -n "${DISCORD_WEBHOOK:-}" ]; then
              bash scripts/notificar-discord.sh SUCCESS || true
            fi
      - notificar_fallo

workflows:
  ci-cd:
    jobs:
      - build

      - tests:
          requires:
            - build

      - quality:
          requires:
            - build

      - package:
          requires:
            - tests
            - quality
          filters:
            branches:
              only:
                - main
                - develop
